<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecionando • Souzza Smart</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #050505;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
    }

    .container {
        width: 100%;
        max-width: 520px;
    }

    .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(34, 197, 94, 0.12);
        border: 1px solid rgba(34, 197, 94, 0.35);
        font-size: 30px;
    }

    h1 {
        margin: 0 0 14px;
        font-size: 26px;
        line-height: 1.25;
        font-weight: 700;
    }

    p {
        margin: 0;
        color: #a1a1aa;
        font-size: 16px;
        line-height: 1.6;
    }

    .loader {
        width: 28px;
        height: 28px;
        margin: 28px auto 0;
        border: 3px solid rgba(255,255,255,.15);
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: spin .8s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
</head>

<body>
    <main class="container">
        <div class="icon">🔒</div>
        <h1>Pedido de entrada no grupo aceito</h1>
        <p>Seu acesso está sendo liberado. Aguarde...</p>
        <div class="loader" aria-label="Redirecionando"></div>
    </main>

    <!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '2493132487808126');
fbq('track', 'PageView');

/*
 * Fluxo automático:
 * 1) Aguarda a página terminar de carregar.
 * 2) Registra Purchase no Meta Pixel.
 * 3) Aguarda brevemente para permitir o envio do evento.
 * 4) Redireciona para o mesmo destino usado nos botões de entrada.
 */
window.addEventListener('load', function () {
    var groupUrl = 'https://www.cupomradaroficial.com/g/souzzasmart';

    fbq('track', 'Purchase', {
        value: 0,
        currency: 'BRL'
    });

    setTimeout(function () {
        window.location.href = groupUrl;
    }, 800);
});
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=2493132487808126&ev=PageView&noscript=1"
/></noscript>
<!-- End Meta Pixel Code -->

    <script>
        window.addEventListener('load', function () {
            var groupUrl = 'https://www.cupomradaroficial.com/g/souzzasmart';

            // Registra o Purchase automaticamente após o carregamento completo.
            fbq('track', 'Purchase', {
                value: 0,
                currency: 'BRL'
            });

            // Pequeno intervalo para permitir o envio do evento antes do redirecionamento.
            setTimeout(function () {
                window.location.href = groupUrl;
            }, 800);
        });
    </script>
</body>
</html>
